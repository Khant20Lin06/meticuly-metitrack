version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: metitrack_postgres
    restart: always
    environment:
      POSTGRES_DB: metitrack
      POSTGRES_USER: metitrack_user
      POSTGRES_PASSWORD: metitrack_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metitrack_user -d metitrack"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metitrack_backend
    restart: always
    environment:
      DEBUG: "True"
      SECRET_KEY: "metitrack-production-docker-secret-key-2026"
      POSTGRES_DB: metitrack
      POSTGRES_USER: metitrack_user
      POSTGRES_PASSWORD: metitrack_secret
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metitrack_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
